<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="data:,"><title>Shapeshifter: Tree of Life</title>
<style>
html,body{margin:0;background:#0b1020;color:#eee;font-family:sans-serif;touch-action:manipulation;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{display:flex;justify-content:center}
#pad{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
#pad div{display:grid;grid-template-columns:repeat(3,56px);gap:6px;pointer-events:auto}
#pad button,#mute{font-size:22px;border-radius:12px;border:2px solid #9fd;background:#1a2a40cc;color:#fff;height:56px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#power{width:110px;height:72px!important;pointer-events:auto;align-self:end}
#mute{position:fixed;top:8px;right:8px;width:52px;height:44px}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head><body>
<div id="game"></div>
<button id="mute" aria-label="Mute">🔊</button>
<div id="pad">
 <div><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
 <button id="power" data-k="space">Power ✨</button>
</div>
<script src="game.js"></script>
</body></html>
